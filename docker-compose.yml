services:
  neo4j:
    image: neo4j:5-community
    container_name: documents-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser UI
      - "127.0.0.1:7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/familygraphrag
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=1g
    volumes:
      - ./data/graph/neo4j/data:/data
      - ./data/graph/neo4j/logs:/logs
      - ./data/graph/neo4j/import:/var/lib/neo4j/import

